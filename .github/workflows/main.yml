name: Build APK with Buildozer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Get Date
      id: get-date
      run: |
        echo "date=$(date -u +'%Y%m%d')" >> $GITHUB_OUTPUT
      shell: bash

    - name: Cache Buildozer global directory
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: buildozer-global-${{ hashFiles('buildozer.spec') }}-${{ steps.get-date.outputs.date }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ccache git zlib1g-dev libncurses5-dev libgdbm-dev libncursesw5-dev libssl-dev libsqlite3-dev tk-dev libgdbm-compat-dev libreplay-dev liblzma-dev libffi-dev uuid-dev lzip
        pip install --upgrade pip
        pip install Cython==0.29.33 buildozer

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build with Buildozer
      run: |
        yes | buildozer -v android debug
      env:
        GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DeepSite-v2-Debug-APK
        path: bin/*.apk
